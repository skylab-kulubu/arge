name: GHCR

# Club convention (same as skylab-site and core-frontend):
#   production branch -> :production, :<sha>             -> DOKPLOY_DEPLOY_HOOK (production app)
#   main              -> :latest, :sandbox, :<sha>       -> DOKPLOY_SANDBOX_DEPLOY_HOOK (sandbox app)
#   v* tags           -> :<sha> only, production URLs, no deploy
# Only NEXT_PUBLIC_* values are baked into the image, so the sandbox and production images
# differ only in their public URLs. CMS_URL, CMS_CDN_URL, KEYCLOAK_* and NEXTAUTH_* are read
# at runtime from the Dokploy environment.

on:
  push:
    branches: [main, production]
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: tags
        run: |
          img=ghcr.io/skylab-kulubu/arge
          sha='${{ github.sha }}'
          ref='${{ github.ref_name }}'
          if [ "$ref" = production ]; then
            echo "list=${img}:production,${img}:${sha}" >> "$GITHUB_OUTPUT"
          elif [ "$ref" = main ]; then
            echo "list=${img}:latest,${img}:sandbox,${img}:${sha}" >> "$GITHUB_OUTPUT"
          else
            echo "list=${img}:${sha}" >> "$GITHUB_OUTPUT"
          fi
      - id: environment
        run: |
          ref='${{ github.ref_name }}'
          if [ "$ref" = production ] || [[ "$ref" == v* ]]; then
            echo "site_url=https://arge.yildizskylab.com" >> "$GITHUB_OUTPUT"
            echo "forms_url=https://forms.yildizskylab.com" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://sandbox-arge.yildizskylab.com" >> "$GITHUB_OUTPUT"
            echo "forms_url=https://sandbox-forms.yildizskylab.com" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ steps.environment.outputs.site_url }}
            NEXT_PUBLIC_FORMS_URL=${{ steps.environment.outputs.forms_url }}
      - name: Notify Dokploy
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
        env:
          REF_NAME: ${{ github.ref_name }}
          SANDBOX_HOOK: ${{ secrets.DOKPLOY_SANDBOX_DEPLOY_HOOK }}
          PRODUCTION_HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [ "$REF_NAME" = main ]; then
            HOOK="$SANDBOX_HOOK"
            SECRET_NAME=DOKPLOY_SANDBOX_DEPLOY_HOOK
          else
            HOOK="$PRODUCTION_HOOK"
            SECRET_NAME=DOKPLOY_DEPLOY_HOOK
          fi
          if [ -z "$HOOK" ]; then
            echo "Dokploy hook unset for ${REF_NAME}; skip"
            echo "::notice title=Dokploy deploy skipped::${SECRET_NAME} is not set, so the ${REF_NAME} image was pushed to GHCR but no Dokploy app was redeployed."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
